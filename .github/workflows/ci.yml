name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: ['**'] # '*' doesn't match names with a slash (stacked PRs)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Type-checked translation keys
        run: pnpm test:types

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e-nextjs:
    name: E2E (Next.js ${{ matrix.next }}, ${{ matrix.prefix }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - next: "14"
            react: "18"
            prefix: never
          - next: "15"
            react: "19"
            prefix: never
          - next: "16"
            react: "19"
            prefix: never
          - next: "14"
            react: "18"
            prefix: as-needed
          - next: "16"
            react: "19"
            prefix: as-needed
          - next: "16"
            react: "19"
            prefix: always

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Scaffold, build, and serve a CLI-generated app
        run: scripts/e2e-nextjs.sh ${{ matrix.next }} ${{ matrix.react }}
        env:
          LOCALE_PREFIX: ${{ matrix.prefix }}
          E2E_BROWSER: "1"
